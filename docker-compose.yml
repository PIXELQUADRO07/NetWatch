version: "3.9"

services:
  # ── Backend ────────────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: netwatch-backend
    restart: unless-stopped
    # Required for raw packet capture
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_PTRACE
    environment:
      - NETWATCH_PORT=5000
      - NETWATCH_DB=/data/netwatch.db
      - NETWATCH_DEMO=${NETWATCH_DEMO:-false}
      - NETWATCH_INTERFACE=${NETWATCH_INTERFACE:-}
      - NETWATCH_SECRET_KEY=${NETWATCH_SECRET_KEY:-change-me-in-production}
      - NETWATCH_ADMIN_USER=${NETWATCH_ADMIN_USER:-admin}
      - NETWATCH_ADMIN_PASS=${NETWATCH_ADMIN_PASS:-netwatch}
      - NETWATCH_JWT_EXPIRY=${NETWATCH_JWT_EXPIRY:-86400}
    volumes:
      - netwatch-data:/data
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── Frontend (Nginx serving Vite build) ───────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: netwatch-frontend
    restart: unless-stopped
    ports:
      - "${NETWATCH_UI_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  netwatch-data:
    driver: local
